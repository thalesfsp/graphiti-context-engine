name: Build, Test, and Publish

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Run tests
      run: npm test

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: test
    # Only publish on version tags
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@^11.5.1

      - run: npm ci
      - run: npm run build
      - run: npm publish --access public

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Extract version
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release v${{ steps.get_version.outputs.VERSION }}
        body: |
          ## Graphiti Context Engine v${{ steps.get_version.outputs.VERSION }}

          ### Installation
          ```bash
          npm install @thalesfsp/graphiti-context-engine
          ```

          ### Features
          - Knowledge graph context engine for OpenClaw
          - First-class tools: graphiti_search, graphiti_store, graphiti_get
          - Neo4j + Graphiti integration
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
